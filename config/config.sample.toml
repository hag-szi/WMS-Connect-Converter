# Sample-Konfig für den WMS Connect Converter.
# Kopiere nach `config/config.toml` und trage die Credentials ein
# (alternativ per Env-Variable `WMS_CONNECT__AMQP__URL`).

[logging]
dir   = "logs"
level = "info"

[amqp]
url                  = "amqp://svc-wms-connect-dev:CHANGEME@localhost:5672/%2F"
inbound_queue_asn    = "wms-connect.inbound.asn.dev"
inbound_queue_art    = "wms-connect.inbound.art.dev"
inbound_queue_order  = "wms-connect.inbound.order.dev"
prefetch             = 10

# Einheitliches Dateinamen-Schema für alle Mandanten und alle drei
# Event-Typen. Platzhalter:
#   {mandant}              Mandantennummer aus dem Event
#   {date:FORMAT}          chrono-strftime, z.B. %Y%m%d
#   {time:FORMAT}          chrono-strftime, z.B. %H%M%S
#   {seq}, {seq:05}        Pro-Mandant-Counter, optional zero-padded
#   {count}                Anzahl Rows/Orders im Event (verfügbar,
#                          wird im Default-Schema nicht genutzt)
#   {trigger}              nur ART-Events: trigger_artikelnr
#   {auftragsnr}           nur ORDER-Events: hl40[3] des ersten Auftrags
[filenames]
asn   = "{mandant}_asn_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
art   = "{mandant}_art_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
order = "{mandant}_order_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"

# Ein Eintrag pro Mandant. Nur `key` + `output_dir` — der Dateiname
# kommt aus [filenames] und ist mandant-unabhängig. Unbekannte
# Mandanten in Events werden per DLX abgelehnt.
[[mandant]]
key        = "520"
output_dir = "out/520"

[[mandant]]
key        = "510"
output_dir = "out/510"

# ALDI-Familie: 871/875/877/885/886/889 analog.
[[mandant]]
key        = "871"
output_dir = "out/aldi/871"
