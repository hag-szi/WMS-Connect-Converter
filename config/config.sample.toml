# Sample-Konfig für den WMS Connect Converter.
# Kopiere nach `config/config.toml` und trage die Credentials ein
# (alternativ per Env-Variable `WMS_CONNECT__AMQP__URL`).

[logging]
dir   = "logs"
level = "info"

[amqp]
url                  = "amqp://svc-wms-connect-dev:CHANGEME@localhost:5672/%2F"
inbound_queue_asn    = "wms-connect.inbound.asn.dev"
inbound_queue_art    = "wms-connect.inbound.art.dev"
inbound_queue_order  = "wms-connect.inbound.order.dev"
prefetch             = 10

# Ein Eintrag pro Mandant. Unbekannte Mandanten in Events werden
# rejected (landen im DLX).
#
# Dateinamen-Platzhalter:
#   {mandant}              Mandantennummer
#   {date:FORMAT}          chrono-strftime, z.B. %Y%m%d oder %d.%m.%Y
#   {time:FORMAT}          chrono-strftime, z.B. %H%M%S
#   {seq}, {seq:05}        Pro-Mandant-Atomic-Counter, optional zero-padded
#   {count}                Anzahl Rows/Orders im Event
#   {trigger}              ART: trigger_artikelnr
#   {auftragsnr}           ORDER: hl40[3] des ersten Auftrags

[[mandant]]
key               = "520"
encoding          = "iso-8859-1"
asn_file_name     = "{mandant}_asn_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
art_file_name     = "{mandant}_art_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}_{trigger}.dat"
order_file_name   = "{mandant}_order_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
output_dir        = "out/520"

[[mandant]]
key               = "510"
encoding          = "utf-8"
asn_file_name     = "{mandant}_asn_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
art_file_name     = "{mandant}_art_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}_{trigger}.dat"
order_file_name   = "{mandant}_order_{date:%Y%m%d}_{time:%H%M%S}_{count}_auftraege.dat"
output_dir        = "out/510"

# ALDI-Familie – gleiches Template, unterschiedliche output_dirs.
# (Kopiere den Block für 875/877/885/886/889 analog, sobald gebraucht.)
[[mandant]]
key               = "871"
encoding          = "iso-8859-1"
asn_file_name     = "{mandant}_asn_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}.dat"
art_file_name     = "{mandant}_art_{date:%Y%m%d}_{time:%H%M%S}_{seq:05}_{trigger}.dat"
order_file_name   = "{mandant}_order_{date:%d.%m.%Y}_{auftragsnr}.dat"
output_dir        = "out/aldi/871"
