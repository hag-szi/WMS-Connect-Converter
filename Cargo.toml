[package]
name = "wms-connect-converter"
version = "0.1.0"
edition = "2021"
authors = ["IT Hartmann <it@hartmannag.de>"]
description = "Bus-Consumer, der wms.{asn,art,order}-ready-Events in Lobster-kompatible .dat-Dateien überführt."

[[bin]]
name = "wms-connect-converter"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# AMQP (RabbitMQ) — hinter einem dünnen Bus-Trait, damit ein späterer
# Wechsel (Kafka/Redpanda/…) nur einen Adapter tauscht.
lapin = "2.5"
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
futures-lite = "2"
async-trait = "0.1"

# Serde + JSON (Event-Payloads spiegeln die Pydantic-Contracts)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"       # Latin-1 / UTF-8 Umschaltung je Mandant
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
